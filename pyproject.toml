[project]
name = "library-management-system"
version = "1.0.0"
description = "Professional Library Management System with Smart Shelf and Location Tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.1",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "werkzeug>=3.0.0",
    "gunicorn>=21.2.0"
]

[tool.vercel]
entrypoint = "api/index.py"
