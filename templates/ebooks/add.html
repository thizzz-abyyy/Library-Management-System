{% extends "base.html" %}

{% block title %}Upload E-Book - {{ library_name }}{% endblock %}
{% block page_title %}Upload Digital E-Book (PDF){% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-8 col-lg-9">
        <div class="card card-custom p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-4">
                <div class="kpi-icon-box kpi-icon-danger">
                    <i class="bi bi-file-earmark-pdf-fill"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-1">Upload New E-Book Resource</h4>
                    <p class="text-muted small mb-0">Supported formats: PDF, EPUB up to 16MB file size.</p>
                </div>
            </div>

            <form method="POST" enctype="multipart/form-data" action="{{ url_for('ebooks.add') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">E-Book Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control form-control-custom" placeholder="e.g. Artificial Intelligence: A Modern Approach" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Author(s) <span class="text-danger">*</span></label>
                        <input type="text" name="author" class="form-control form-control-custom" placeholder="Stuart Russell, Peter Norvig" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Category</label>
                        <select name="category_id" class="form-select form-select-custom">
                            <option value="">Select Academic Category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">PDF E-Book Binary File <span class="text-danger">*</span></label>
                        <input type="file" name="ebook_file" class="form-control form-control-custom" accept=".pdf,.epub" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Custom Cover Artwork (Optional)</label>
                        <input type="file" name="cover_image" class="form-control form-control-custom" accept="image/*">
                    </div>

                    <div class="col-md-6 d-flex align-items-center pt-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_downloadable" id="is_downloadable" checked>
                            <label class="form-check-label small fw-bold" for="is_downloadable">Allow Student Offline PDF Downloads</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-bold">Book Synopsis / Scope</label>
                        <textarea name="description" class="form-control form-control-custom" rows="3" placeholder="Brief abstract of the digital volume..."></textarea>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('ebooks.list_ebooks') }}" class="btn btn-outline-custom">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom px-4">
                        <i class="bi bi-cloud-arrow-up-fill me-1"></i> Upload E-Book
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
